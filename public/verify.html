<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من أصالة المنتج</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 90%; }
        .icon { font-size: 50px; margin-bottom: 12px; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .desc { font-size: 14px; color: #475569; line-height: 1.5; }
        .success { color: #16a34a; }
        .warning { color: #d97706; }
        .danger { color: #dc2626; }
    </style>
</head>
<body>

<div class="card" id="card">
    <div class="icon">⏳</div>
    <div class="title">جاري التحقق من الأصالة...</div>
    <div class="desc">يرجى الانتظار لحطة.</div>
</div>

<script>
    async function checkProduct() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const card = document.getElementById('card');

        if (!code) {
            card.innerHTML = `
                <div class="icon danger">❌</div>
                <div class="title danger">رمز مفقود</div>
                <div class="desc">لم يتم العثور على رمز للتحقق.</div>
            `;
            return;
        }

        try {
            const res = await fetch(`/api/verify-code?code=${encodeURIComponent(code)}`);
            const data = await res.json();

            if (data.status === 'authentic') {
                card.innerHTML = `
                    <div class="icon success">✅</div>
                    <div class="title success">منتج أصلي ومضمون</div>
                    <div class="desc"><strong>${data.productName}</strong><br>${data.message}</div>
                `;
            } else if (data.status === 'scanned_before') {
                card.innerHTML = `
                    <div class="icon warning">⚠️</div>
                    <div class="title warning">تم فحص المنتج سابقاً</div>
                    <div class="desc"><strong>${data.productName}</strong><br>${data.message}<br><small>أول فحص: ${data.firstScanDate}</small></div>
                `;
            } else {
                card.innerHTML = `
                    <div class="icon danger">🚫</div>
                    <div class="title danger">منتج غير معتمد</div>
                    <div class="desc">هذا الرمز غير مسجل في قاعدة بياناتنا.</div>
                `;
            }
        } catch (e) {
            card.innerHTML = `
                <div class="icon danger">⚠️</div>
                <div class="title danger">خطأ بالاتصال</div>
                <div class="desc">تعذر الوصول إلى نظام التحقق حالياً.</div>
            `;
        }
    }
    checkProduct();
</script>

</body>
</html>
