<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام استقطاب الطلاب - التحقق من المستندات</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header-img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
    }
    .container {
      background: #ffffff;
      margin-top: 20px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 90%;
      max-width: 480px;
      text-align: center;
    }
    .logo {
      width: 80px;
      margin-bottom: 15px;
    }
    h2 {
      margin: 10px 0 5px;
      color: #333;
    }
    p.sub {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .status-box {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 15px;
      font-weight: bold;
      display: none;
    }
    .status-authentic {
      background-color: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }
    .status-warning {
      background-color: #fef7e0;
      color: #b06000;
      border: 1px solid #feefc3;
    }
    .status-error {
      background-color: #fce8e6;
      color: #c5221f;
      border: 1px solid #fad2cf;
    }
    .btn-pdf {
      display: inline-block;
      background-color: #6f42c1;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
      transition: background 0.3s;
    }
    .btn-pdf:hover {
      background-color: #593196;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #6f42c1;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/ thumb/8/87/Cyprus_International_University_Logo.png/800px-Cyprus_International_University_Logo.png" alt="CIU Logo" class="logo" onerror="this.style.display='none'">
    <h2>نظام استقطاب الطلاب</h2>
    <p class="sub">التحقق من مستندات المرشح</p>

    <div id="loader" class="loader"></div>
    <div id="statusBox" class="status-box"></div>
    
    <div id="actionArea" style="display: none;">
      <a id="pdfLink" href="#" target="_blank" class="btn-pdf">📄 عرض وثيقة PDF</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      const loader = document.getElementById('loader');
      const statusBox = document.getElementById('statusBox');
      const actionArea = document.getElementById('actionArea');
      const pdfLink = document.getElementById('pdfLink');

      if (!code) {
        loader.style.display = 'none';
        statusBox.className = 'status-box status-error';
        statusBox.innerText = 'يرجى إدخال كود وثيقة صالحة.';
        statusBox.style.display = 'block';
        return;
      }

      fetch(`/api/verify-code?code=${encodeURIComponent(code.trim())}`)
        .then(response => response.json())
        .then(data => {
          loader.style.display = 'none';

          if (data.status === 'authentic') {
            statusBox.className = 'status-box status-authentic';
            statusBox.innerHTML = `✅ تم التحقق من الوثيقة بنجاح!<br><small>${data.productName || ''}</small>`;
            statusBox.style.display = 'block';

            if (data.documentUrl) {
              pdfLink.href = data.documentUrl;
              actionArea.style.display = 'block';
              // التوجيه التلقائي لفتح الـ PDF
              window.location.href = data.documentUrl;
            }

          } else if (data.status === 'scanned_before') {
            statusBox.className = 'status-box status-warning';
            statusBox.innerHTML = `⚠️ تم التحقق من هذا المستند سابقاً!<br><small>عدد مرات الفحص: ${data.scanCount}</small>`;
            statusBox.style.display = 'block';

            if (data.documentUrl) {
              pdfLink.href = data.documentUrl;
              actionArea.style.display = 'block';
              // التوجيه التلقائي لفتح الـ PDF
              window.location.href = data.documentUrl;
            }

          } else {
            statusBox.className = 'status-box status-error';
            statusBox.innerText = '❌ رمز الوثيقة غير صالح أو غير موجود بالنظام.';
            statusBox.style.display = 'block';
          }
        })
        .catch(err => {
          loader.style.display = 'none';
          statusBox.className = 'status-box status-error';
          statusBox.innerText = 'حدث خطأ أثناء الاتصال بالسيرفر.';
          statusBox.style.display = 'block';
        });
    });
  </script>
</body>
</html>
